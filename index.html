<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DramaHub — Streaming Drakor & Dracin</title>
  <meta name="description" content="Streaming-style directory untuk drakor dan dracin. Nonton trailer resmi dan klik ke platform legal.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://image.tmdb.org">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span>Drama<span class="accent">Hub</span></span></a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link active">Beranda</a>
      </nav>
    </div>
  </header>

  <!-- HERO (cinematic: full-bleed backdrop, scrim to black, bottom-left content) -->
  <section class="hero">
    <div class="hero-media" id="hero-backdrop"></div>
    <div class="hero-tint"></div>
    <div class="hero-scrim"></div>
    <div class="container">
      <div class="hero-content">
        <h1 id="hero-title"></h1>
        <div class="hero-meta" id="hero-meta"></div>
        <p class="hero-desc" id="hero-desc"></p>
        <div class="hero-actions" id="hero-actions"></div>
      </div>
    </div>
  </section>

  <main class="container">
    <!-- FEATURED ROW (carousel) -->
    <section class="row" id="featured-row">
      <div class="row-head">
        <h2 class="row-title">Pilihan Editor</h2>
        <div class="carousel-controls">
          <button type="button" class="ctrl-btn" id="feat-prev" aria-label="Geser ke kiri"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
          <button type="button" class="ctrl-btn" id="feat-next" aria-label="Geser ke kanan"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
      </div>
      <div class="carousel" id="featured"></div>
      <div class="carousel-dots" id="feat-dots"></div>
    </section>

    <!-- NEW RELEASES ROW -->
    <section class="row" id="newrow-section">
      <div class="row-head">
        <h2 class="row-title">Baru Rilis</h2>
        <div class="carousel-controls">
          <button type="button" class="ctrl-btn" id="new-prev" aria-label="Geser ke kiri"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
          <button type="button" class="ctrl-btn" id="new-next" aria-label="Geser ke kanan"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
      </div>
      <div class="carousel" id="newrow"></div>
      <div class="carousel-dots" id="new-dots"></div>
    </section>

    <!-- CATALOG -->
    <section class="row">
      <div class="row-head">
        <h2 class="row-title">Semua Drama</h2>
      </div>
      <div class="toolbar">
        <div class="tab-group" id="tab-asal">
          <button class="tab active" data-asal="all">Semua</button>
          <button class="tab" data-asal="drakor">Drakor</button>
          <button class="tab" data-asal="dracin">Dracin</button>
          <button class="tab" data-asal="film">Film</button>
        </div>
        <div class="search-wrap">
          <input type="search" id="search" placeholder="Cari judul / genre / aktor...">
        </div>
        <div class="filter-wrap">
          <select id="genre-filter" aria-label="Filter genre">
            <option value="all">Semua Genre</option>
          </select>
        </div>
      </div>
      <p class="result-info" id="result-info"></p>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>Tidak ada hasil yang cocok.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> DramaHub — Direktori streaming drakor &amp; dracin legal.</p>
      <p class="muted">Hanya trailer resmi &amp; link ke platform resmi. Kami tidak menyimpan konten bajakan.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
