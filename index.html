<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DramaHub — Streaming Drakor & Dracin</title>
  <meta name="description" content="Streaming-style directory untuk drakor dan dracin. Nonton trailer resmi dan klik ke platform legal.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DramaHub">
  <meta property="og:title" id="og-title" content="DramaHub — Streaming Drakor & Dracin">
  <meta property="og:description" id="og-desc" content="Direktori streaming drakor & dracin legal — trailer resmi + link ke platform.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://image.tmdb.org">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span>Drama<span class="accent">Hub</span></span></a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link active">Beranda</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-ghost btn-sm header-search" href="cari.html" aria-label="Cari"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span>Cari</span></a>
      </div>
    </div>
  </header>

  <!-- HERO (cinematic: full-bleed backdrop, scrim to black, bottom-left content) -->
  <section class="hero">
    <div class="hero-media" id="hero-backdrop"></div>
    <div class="hero-video" id="hero-video" hidden><iframe src="about:blank" title="Trailer" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe></div>
    <div class="hero-tint"></div>
    <div class="hero-scrim"></div>
    <div class="container">
      <div class="hero-content">
        <h1 id="hero-title"></h1>
        <div class="hero-meta" id="hero-meta"></div>
        <p class="hero-desc" id="hero-desc"></p>
        <div class="hero-actions" id="hero-actions"></div>
      </div>
    </div>
    <div class="hero-dots" id="hero-dots"></div>
  </section>

  <main class="container">
    <!-- FEATURED ROW (carousel) -->
    <section class="row" id="featured-row">
      <div class="row-head">
        <h2 class="row-title">Pilihan Editor</h2>
        <div class="carousel-controls">
          <button type="button" class="ctrl-btn" id="feat-prev" aria-label="Geser ke kiri"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
          <button type="button" class="ctrl-btn" id="feat-next" aria-label="Geser ke kanan"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
      </div>
      <div class="carousel" id="featured"></div>
      <div class="carousel-dots" id="feat-dots"></div>
    </section>

    <!-- PERSONAL ROWS (favorites + history, dynamic) -->
    <div id="personal-rows"></div>

    <!-- NEW RELEASES ROW -->
    <section class="row" id="newrow-section">
      <div class="row-head">
        <h2 class="row-title">Baru Rilis</h2>
        <div class="carousel-controls">
          <button type="button" class="ctrl-btn" id="new-prev" aria-label="Geser ke kiri"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
          <button type="button" class="ctrl-btn" id="new-next" aria-label="Geser ke kanan"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
      </div>
      <div class="carousel" id="newrow"></div>
      <div class="carousel-dots" id="new-dots"></div>
    </section>

    <!-- GENRE ROWS (dynamic) -->
    <div id="genre-rows"></div>

    <!-- CATALOG -->
    <section class="row">
      <div class="row-head">
        <h2 class="row-title">Semua Drama</h2>
      </div>
      <div class="toolbar">
        <div class="tab-group" id="tab-asal">
          <button class="tab active" data-asal="all">Semua</button>
          <button class="tab" data-asal="drakor">Drakor</button>
          <button class="tab" data-asal="dracin">Dracin</button>
          <button class="tab" data-asal="film">Film</button>
        </div>
        <div class="search-wrap">
          <input type="search" id="search" placeholder="Cari judul / genre / aktor...">
        </div>
      </div>
      <div class="genre-chips" id="genre-chips" aria-label="Filter genre"></div>
      <p class="result-info" id="result-info"></p>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>Tidak ada hasil yang cocok.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> DramaHub — Direktori streaming drakor &amp; dracin legal.</p>
      <p class="muted">Hanya trailer resmi &amp; link ke platform resmi. Kami tidak menyimpan konten bajakan.</p>
    </div>
  </footer>

  <button type="button" id="to-top" class="to-top" aria-label="Kembali ke atas" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg></button>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi utama">
    <button type="button" class="bn-item" data-bn="home"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Beranda</span></button>
    <button type="button" class="bn-item" data-bn="search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span>Cari</span></button>
    <button type="button" class="bn-item" data-bn="fav"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.5-9A5.4 5.4 0 0 1 12 6a5.4 5.4 0 0 1 9.5 6C19 16.4 12 21 12 21z"/></svg><span>Favorit</span></button>
  </nav>
  <div id="install-banner" class="install-banner" role="dialog" aria-label="Download app" hidden>
    <svg class="ib-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/></svg>
    <div class="ib-body">
      <strong>Pasang DramaHub</strong>
      <span>Buka lebih cepat &amp; layar penuh.</span>
    </div>
    <button type="button" class="btn btn-primary btn-sm ib-btn">Download</button>
    <button type="button" class="ib-close" aria-label="Tutup"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <script src="app.js"></script>
</body>
</html>
